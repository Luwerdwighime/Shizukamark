name: shizukamark
description: "Shizukamark - Steganography application powered by audiowmark and Flutter"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Audio and Stego tools
  ffmpeg_kit_flutter_new: ^3.1.0
  file_picker: ^8.1.4
  path_provider: ^2.1.5
  path: ^1.9.0
  wakelock_plus: ^1.2.8

  # Database and Storage
  sqflite: ^2.4.1
  archive: ^4.0.2
  crypto: ^3.0.6

  # Permissions and Utilities
  permission_handler: ^11.3.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
