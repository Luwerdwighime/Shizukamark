name: Build Android

on:
  push:
    branches: [ main, develop ]
  tags:
    - 'v*'
  workflow_dispatch:

env:
  GRADLE_VERSION: '8.9'

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  build-android:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.27.x'
          cache: true

      - name: Restore native binaries from cache
        uses: actions/cache/restore@v4
        with:
          path: android/app/src/main/jniLibs
          key: jnilibs-${{ hashFiles('scripts/build_audiowmark_android.sh') }}
          restore-keys: |
            jnilibs-

      - name: Ensure native directories exist
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          mkdir -p android/app/src/main/jniLibs/armeabi-v7a
          mkdir -p android/app/src/main/jniLibs/x86_64

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Configure Android local.properties
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //')
          VERSION_NAME=$(echo "$VERSION" | cut -d'+' -f1)
          VERSION_CODE=$(echo "$VERSION" | cut -d'+' -f2)
          cat <<EOF > android/local.properties
          sdk.dir=$ANDROID_HOME
          flutter.sdk=$FLUTTER_ROOT
          flutter.buildMode=release
          flutter.versionName=${VERSION_NAME:-1.0.0}
          flutter.versionCode=${VERSION_CODE:-1}
          EOF

      - name: Decode Keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystore.jks

      - name: Configure signing properties
        if: env.HAS_KEYSTORE == 'true'
        env:
          HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          cat <<EOF > android/key.properties
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=keystore.jks
          EOF

      - name: Build Android APK with Gradle
        run: |
          cd android
          gradle :app:assembleRelease --stacktrace

      - name: Prepare APK artifact
        run: |
          mkdir -p build/app/outputs/flutter-apk
          if [ -f build/app/outputs/apk/release/app-release.apk ] && [ ! -f build/app/outputs/flutter-apk/app-release.apk ]; then
            cp build/app/outputs/apk/release/app-release.apk build/app/outputs/flutter-apk/app-release.apk
          elif [ -f build/app/outputs/apk/release/app-release-unsigned.apk ] && [ ! -f build/app/outputs/flutter-apk/app-release.apk ]; then
            cp build/app/outputs/apk/release/app-release-unsigned.apk build/app/outputs/flutter-apk/app-release.apk
          fi
          ls -la build/app/outputs/flutter-apk/

      - name: Build Android App Bundle with Gradle
        run: |
          cd android
          gradle :app:bundleRelease --stacktrace

      - name: Prepare AAB artifact
        run: |
          mkdir -p build/app/outputs/bundle/release
          if [ ! -f build/app/outputs/bundle/release/app-release.aab ]; then
            find build/app/outputs -name "*.aab" -exec cp {} build/app/outputs/bundle/release/app-release.aab \;
          fi
          ls -la build/app/outputs/bundle/release/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
